{% extends "dashboard/base.html" %}

{% block content %}
<div class="max-w-md mx-auto">
    <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-8 text-center">
        <div class="w-14 h-14 rounded-full bg-red-50 flex items-center justify-center mx-auto mb-4">
            <svg class="w-7 h-7 text-red-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                      d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/>
            </svg>
        </div>
        <h2 class="text-sm font-bold text-gray-900 mb-2">O'chirishni tasdiqlash</h2>
        <p class="text-xs text-gray-500 mb-6">
            Rostdan ham <span class="font-semibold text-gray-700">{{ object }}</span> ni o'chirmoqchimisiz?
            Bu amalni ortga qaytarib bo'lmaydi.
        </p>
        <div class="flex items-center justify-center gap-3">
            <form method="post">
                {% csrf_token %}
                <button type="submit"
                        class="px-5 py-2 text-xs font-semibold text-white bg-red-500 rounded-2xl hover:bg-red-600 transition">
                    Ha, o'chirish
                </button>
            </form>
            <a href="{{ cancel_url|default:request.META.HTTP_REFERER|default:'javascript:history.back()' }}"
               class="px-5 py-2 text-xs font-medium text-gray-500 bg-gray-100 rounded-2xl hover:bg-gray-200 transition">
                Bekor qilish
            </a>
        </div>
    </div>
</div>
{% endblock %}
