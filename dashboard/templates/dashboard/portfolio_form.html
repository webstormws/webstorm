{% extends "dashboard/base.html" %}
{% block title %}{% if item %}Tahrirlash{% else %}Yaratish{% endif %} — Portfolio{% endblock %}
{% block page_title %}{% if item %}Loyihani tahrirlash{% else %}Yangi loyiha{% endif %}{% endblock %}

{% block content %}
<form method="post" enctype="multipart/form-data" class="max-w-2xl space-y-6">
    {% csrf_token %}
    <div class="bg-white rounded-2xl border border-gray-100 shadow-sm p-6 space-y-4">
        <div>
            <label class="text-xs font-semibold text-gray-500">Loyiha nomi</label>
            <input type="text" name="title" value="{{ item.title|default:'' }}" required class="w-full mt-1 px-4 py-3 rounded-xl border border-gray-200 text-sm focus:outline-none focus:border-indigo-500 bg-gray-50/50">
        </div>
        <div>
            <label class="text-xs font-semibold text-gray-500">Tavsif</label>
            <textarea name="description" rows="4" class="w-full mt-1 px-4 py-3 rounded-xl border border-gray-200 text-sm focus:outline-none focus:border-indigo-500 bg-gray-50/50">{{ item.description|default:'' }}</textarea>
        </div>
        <div class="grid grid-cols-2 gap-4">
            <div>
                <label class="text-xs font-semibold text-gray-500">Kategoriya</label>
                <select name="category" class="w-full mt-1 px-4 py-3 rounded-xl border border-gray-200 text-sm focus:outline-none focus:border-indigo-500 bg-gray-50/50">
                    <option value="crm" {% if item.category == 'crm' %}selected{% endif %}>CRM</option>
                    <option value="bot" {% if item.category == 'bot' %}selected{% endif %}>Telegram Bot</option>
                    <option value="website" {% if item.category == 'website' %}selected{% endif %}>Web Sayt</option>
                    <option value="webapp" {% if item.category == 'webapp' %}selected{% endif %}>Web App</option>
                    <option value="mobile" {% if item.category == 'mobile' %}selected{% endif %}>Mobile App</option>
                    <option value="automation" {% if item.category == 'automation' %}selected{% endif %}>Automation</option>
                </select>
            </div>
            <div>
                <label class="text-xs font-semibold text-gray-500">Tartib</label>
                <input type="number" name="order" value="{{ item.order|default:'0' }}" class="w-full mt-1 px-4 py-3 rounded-xl border border-gray-200 text-sm focus:outline-none focus:border-indigo-500 bg-gray-50/50">
            </div>
        </div>
        <div>
            <label class="text-xs font-semibold text-gray-500">Texnologiyalar</label>
            <input type="text" name="technologies" value="{{ item.technologies|default:'' }}" class="w-full mt-1 px-4 py-3 rounded-xl border border-gray-200 text-sm focus:outline-none focus:border-indigo-500 bg-gray-50/50" placeholder="Django, React, PostgreSQL">
        </div>
        <div>
            <label class="text-xs font-semibold text-gray-500">Demo URL</label>
            <input type="url" name="demo_url" value="{{ item.demo_url|default:'' }}" class="w-full mt-1 px-4 py-3 rounded-xl border border-gray-200 text-sm focus:outline-none focus:border-indigo-500 bg-gray-50/50">
        </div>
        <div>
            <label class="text-xs font-semibold text-gray-500">Rasm</label>
            <input type="file" name="image" accept="image/*" class="w-full mt-1 text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-bold file:bg-indigo-50 file:text-indigo-600 hover:file:bg-indigo-100">
        </div>
        <label class="flex items-center gap-2 cursor-pointer">
            <input type="checkbox" name="is_active" {% if item.is_active or not item %}checked{% endif %} class="w-4 h-4 text-indigo-600 rounded">
            <span class="text-sm text-gray-600">Faol</span>
        </label>
    </div>
    <div class="flex gap-3">
        <button type="submit" class="px-6 py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-bold rounded-xl shadow transition">Saqlash</button>
        <a href="{% url 'dashboard:portfolio' %}" class="px-6 py-2.5 bg-gray-100 hover:bg-gray-200 text-gray-600 text-xs font-bold rounded-xl transition">Bekor qilish</a>
    </div>
</form>
{% endblock %}
