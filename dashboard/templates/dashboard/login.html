<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — Web Storm Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body class="bg-gray-50 font-sans min-h-screen flex items-center justify-center">
    <div class="w-full max-w-sm">
        <div class="text-center mb-8">
            <div class="w-14 h-14 bg-indigo-600 rounded-2xl flex items-center justify-center text-white text-2xl font-black mx-auto mb-4 shadow-lg shadow-indigo-500/30">W</div>
            <h1 class="text-2xl font-extrabold text-gray-900">Web Storm</h1>
            <p class="text-sm text-gray-400 mt-1">Admin Panel ga kirish</p>
        </div>
        <form method="post" class="bg-white p-8 rounded-2xl border border-gray-100 shadow-sm space-y-5">
            {% csrf_token %}
            {% if messages %}
            <div class="bg-red-50 text-red-600 text-xs font-medium p-3 rounded-xl">
                {% for m in messages %}{{ m }}{% endfor %}
            </div>
            {% endif %}
            <div>
                <label class="text-xs font-semibold text-gray-500 uppercase tracking-wider">Login</label>
                <input type="text" name="username" required class="w-full mt-1.5 px-4 py-3 rounded-xl border border-gray-200 text-sm focus:outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-100 bg-gray-50/50 transition" placeholder="Username">
            </div>
            <div>
                <label class="text-xs font-semibold text-gray-500 uppercase tracking-wider">Parol</label>
                <input type="password" name="password" required class="w-full mt-1.5 px-4 py-3 rounded-xl border border-gray-200 text-sm focus:outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-100 bg-gray-50/50 transition" placeholder="Password">
            </div>
            <button type="submit" class="w-full py-3 bg-indigo-600 hover:bg-indigo-700 text-white font-bold text-sm rounded-xl shadow-md shadow-indigo-500/20 hover:shadow-lg transition">
                Kirish
            </button>
        </form>
    </div>
</body>
</html>
